name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tests:
        description: Tests to run
        type: choice
        default: all
        options:
          - all
          - library
          - integration

permissions:
  contents: read

jobs:
  library:
    name: library tests
    if: github.event_name != 'workflow_dispatch' || inputs.tests == 'all' || inputs.tests == 'library'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          persist_github_token: true
      - run: task test:run

  integration:
    name: integration
    if: github.event_name != 'workflow_dispatch' || inputs.tests == 'all' || inputs.tests == 'integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          persist_github_token: true
      - run: task test:matrix
