name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  library:
    name: library tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          persist_github_token: true
      - run: task test:run

  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          persist_github_token: true
      - run: task test:matrix

  docs:
    name: documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          persist_github_token: true
      - run: task -d docs build
